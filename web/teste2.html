<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>body{margin:0} canvas{display:block}</style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <script>
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);

      camera.position.set(0, 40, 50);
      camera.lookAt(0,0,0);

      // Criar matriz de exemplo NxM
      const N = 100, M = 100;
      const matrix = new Float32Array(N * M);
      for (let i=0;i<N;i++){
        for (let j=0;j<M;j++){
          const x = (i - N/2)/5, y=(j - M/2)/5;
          matrix[i*M + j] = Math.sin(Math.hypot(x,y))*2;
        }
      }

      // Criar BufferGeometry plane (grid)
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(N * M * 3);
      const indices = [];
      const uvs = new Float32Array(N*M*2);

      let ptr = 0;
      for (let i=0;i<N;i++){
        for (let j=0;j<M;j++){
          const x = (i - N/2);
          const y = (j - M/2);
          const z = matrix[i*M + j];
          positions[ptr*3 + 0] = x;
          positions[ptr*3 + 1] = z; // z as height (y-up in three.js)
          positions[ptr*3 + 2] = y;
          uvs[ptr*2 + 0] = i/(N-1);
          uvs[ptr*2 + 1] = j/(M-1);
          ptr++;
        }
      }

      // Indexação para formar triângulos
      for (let i=0;i<N-1;i++){
        for (let j=0;j<M-1;j++){
          const a = i*M + j;
          const b = (i+1)*M + j;
          const c = (i+1)*M + (j+1);
          const d = i*M + (j+1);
          indices.push(a,b,d);
          indices.push(b,c,d);
        }
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      // Material simples. Para colormap melhor, usar ShaderMaterial ou map usando DataTexture+fragment shader
      const material = new THREE.MeshStandardMaterial({vertexColors:false, wireframe:false});
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      // Luz
      scene.add(new THREE.AmbientLight(0x666666));
      const dir = new THREE.DirectionalLight(0xffffff, 1.0);
      dir.position.set(50,50,50);
      scene.add(dir);

      // Controles (opcional) - se quiser, inclua OrbitControls script
      function animate(){
        requestAnimationFrame(animate);
        mesh.rotation.y += 0.001;
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
